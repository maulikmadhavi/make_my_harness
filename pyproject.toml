[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "make-harness"
version = "0.1.0"
description = "A minimal, bottom-up agent harness with pluggable tools, permissions, memory, and context compaction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "maulikmadhavi", email = "maulikmadhavi@gmail.com" }]
dependencies = [
    "openai>=3.5,<4",
    "prompt_toolkit>=3.0,<4",
    "requests>=2.34.2,<3",
    "rich>=13.0",
]

[project.scripts]
make-harness = "make_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["make_harness"]
# hatch packages everything under make_harness/, including dotfiles that are
# editor state rather than package code.
exclude = [".claude"]
