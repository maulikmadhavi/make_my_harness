# CI: run the pytest suite, and build the distribution via the pixi task.
#
# The test job is deliberately pip-based (not pixi) — it only needs the
# package plus pytest, not the full dev environment. The build job does use
# pixi, because `build` is defined as a pixi task in pixi.toml and running it
# through pixi is what keeps CI and local `pixi run build` identical.
# No lint step yet (see plan.md Stage 7).
name: test

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pixi.toml
          # fail if pixi.lock is out of date with pixi.toml
          locked: true
          cache: true
      - run: pixi run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
